name: terraform

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  tf_version: 1.9.8

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.tf_version }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.56.0

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: TFLint
        run: tflint --recursive

  inits:
    needs: [linter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.tf_version }}

      - name: Terraform init all examples
        shell: bash
        run: |
          set -euo pipefail

          # Examples reference the published registry source
          # (datafy-io/modules/aws//modules/<name>). That source is not
          # available for the code in this branch, so init against a copy in
          # which the registry source is rewritten to the local module path.
          for dir in examples/*/; do
            [ -d "$dir" ] || continue

            tmp="$(mktemp -d)"
            cp -r "$dir"/. "$tmp"/
            # Point the registry source at the local modules and drop the
            # version constraint (not allowed with local sources).
            sed -i \
              -e "s#datafy-io/modules/aws//modules/#${GITHUB_WORKSPACE}/modules/#g" \
              -e "/^[[:space:]]*version[[:space:]]*=/d" \
              "$tmp"/*.tf

            terraform -chdir="$tmp" init -backend=false
          done
